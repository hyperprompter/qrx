 <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0a0a0f;
  --bg-surface: #0d1117;
  --bg-elevated: #151921;
  --bg-input: #1a1d29;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.09);
  --text-primary: #e6e7eb;
  --text-secondary: #8a8da0;
  --text-muted: #5a5d6e;
  --accent-cyan: #3fb1ff;
  --accent-cyan-glow: #0ea5e9;
  --accent-sky: #7dd3fc;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --header-height: 64px;
}

/* Prevents layout shifting and ensures fullscreen behavior */
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-primary);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--text-primary);
}

/* === LAYOUT WRAPPER (Placed inside #A per instructions) === */
.page-wrapper {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-primary);
}

/* === HEADER BAR === */
.sim-header {
  height: var(--header-height);
  min-height: var(--header-height);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-medium);
  z-index: 10;
  position: relative;
}

.controls-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.title-section {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-cyan-glow), var(--accent-sky));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 16px rgba(14, 165, 233, 0.35);
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--text-primary);
}

.brand-title span {
  color: var(--accent-sky);
  font-weight: 800;
}

/* Inputs */
.sim-header input[type="text"],
.sim-header input[type="number"] {
  background: var(--bg-input);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.sim-header input[type="text"] {
  width: 220px;
}

.sim-header input[type="number"] {
  width: 80px;
  appearance: none;
  -moz-appearance: textfield;
}

.sim-header input[type="number"]::-webkit-inner-spin-button,
.sim-header input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.sim-header input::placeholder {
  color: var(--text-muted);
}

.sim-header input:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(63, 177, 255, 0.15);
}

.sim-header label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  margin-right: -4px;
}

/* Buttons */
.sim-header button {
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

button#submit-btn {
  background: var(--accent-cyan);
  color: #000000;
}

button#submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(63, 177, 255, 0.4);
}

button#pause-btn {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border-medium);
}

button#pause-btn:hover {
  background: var(--bg-primary);
  color: var(--text-primary);
}

/* Status */
#status {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  padding-left: 10px;
  border-left: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
}

#status::before {
  content: '';
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  box-shadow: 0 0 6px rgba(255,255,255,0.1);
}

/* === MAIN WORKSPACE === */
.workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* === SIDEBAR === */
#sidebar {
  width: 340px;
  min-width: 340px;
  max-width: 340px;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-medium);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  z-index: 5;
  position: absolute;
}

.sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-ternary, var(--text-muted));
}

.sidebar-scroll {
  flex: 0 0 auto;
  height: 0;
  padding: 0;
  overflow: visible;
}

/* Scrollbar */
.sidebar-scroll::-webkit-scrollbar {
  width: 5px;
}
.sidebar-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}

/* === CANVAS === */
#sim-canvas {
  display: block;
  background: var(--bg-primary);
  flex: 1;
  height: 100%;
  width: 100%;
  cursor: crosshair;
}

/* === HOVER CARD === */
#hover-card {
  display: none;
  position: fixed;
  top: 76px;
  right: 12px;
  width: 320px;
  z-index: 9999;
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-medium);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
}

#hover-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, var(--accent-cyan-glow), var(--accent-sky));
  z-index: 2;
}

.card-inner {
  padding: 18px 20px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

/* Avatar & Identity Row */
.card-header-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.card-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 2px solid var(--border-medium);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.card-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent 60%);
}

.card-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.card-id-col {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.card-display-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-handle {
  font-size: 12px;
  color: var(--accent-cyan);
  font-weight: 500;
  opacity: 0.9;
}

/* Type Badge */
.card-type-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-particle-type {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--accent-sky);
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(63, 177, 255, 0.08);
  border: 1px solid rgba(63, 177, 255, 0.15);
}

/* Content */
.card-content {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-secondary);
  word-break: break-word;
}

/* Engagement Counts */
.card-engagement-row {
  display: flex;
  gap: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

.engagement-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}

.engagement-item .count {
  color: var(--text-secondary);
}

window.particles = [];
window.loadData = async function(keyword, count) {
  var statusEl = document.getElementById("status");
  var setStatus = function(msg) {
    if (statusEl) statusEl.textContent = msg;
  };

  window.particles = [];
  setStatus("Searching posts...");

  var collectedPosts = [];
  var cursor = undefined;
  var limit = 100;
  var target = parseInt(count) || 25;

  while (collectedPosts.length < target) {
    var since = new Date(Date.now() - 3*24*60*60*1000).toISOString();
    var url = "https://api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=" + encodeURIComponent(keyword) + "&limit=" + limit + "&sort=top&since=" + encodeURIComponent(since);    if (cursor) {
      url = url + "&cursor=" + encodeURIComponent(cursor);
    }
    var res = await fetch(url);
    if (!res.ok) {
      setStatus("Search failed: " + res.status);
      break;
    }
    var data = await res.json();
    if (!data.posts || data.posts.length === 0) {
      break;
    }
    for (var i = 0; i < data.posts.length; i++) {
      var post = data.posts[i];
      if (post.record && !post.record.reply) {
        collectedPosts.push(post);
        if (collectedPosts.length >= target) {
          break;
        }
      }
    }
    cursor = data.cursor;
    if (!cursor) {
      break;
    }
    setStatus("Found " + collectedPosts.length + " top-level posts...");
  }

  if (collectedPosts.length === 0) {
    setStatus("No top-level posts found.");
    window.dispatchEvent(new CustomEvent("data:loaded", { detail: window.particles }));
    return;
  }

  setStatus("Loading engagement data for " + collectedPosts.length + " posts...");

  for (var p = 0; p < collectedPosts.length; p++) {
    var rootPost = collectedPosts[p];
    var rootUri = rootPost.uri;
    var rootHandle = rootPost.author ? rootPost.author.handle : "";
    var rootName = (rootPost.author && rootPost.author.displayName) ? rootPost.author.displayName : rootHandle;
    var rootAvatar = (rootPost.author && rootPost.author.avatar) ? rootPost.author.avatar : "";
    var rootText = (rootPost.record && rootPost.record.text) ? rootPost.record.text : "";

    window.particles.push({
      type: "post",
      name: rootName,
      handle: rootHandle,
      content: rootText,
      avatar: rootAvatar,
      uri: rootUri,
      root: rootUri
    });

    var encodedUri = encodeURIComponent(rootUri);
    var threadUrl = "https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=" + encodedUri + "&depth=10&parentHeight=0";
    var likesUrl = "https://public.api.bsky.app/xrpc/app.bsky.feed.getLikes?uri=" + encodedUri + "&limit=100";
    var repostsUrl = "https://public.api.bsky.app/xrpc/app.bsky.feed.getRepostedBy?uri=" + encodedUri + "&limit=100";
    var quotesUrl = "https://public.api.bsky.app/xrpc/app.bsky.feed.getQuotes?uri=" + encodedUri + "&limit=100";

    setStatus("[" + (p + 1) + "/" + collectedPosts.length + "] Fetching thread, likes, reposts, quotes...");

    var threadRes, likesRes, repostsRes, quotesRes;
    try {
      var promises = [
        fetch(threadUrl),
        fetch(likesUrl),
        fetch(repostsUrl),
        fetch(quotesUrl)
      ];
      var results = await Promise.all(promises);
      threadRes = results[0];
      likesRes = results[1];
      repostsRes = results[2];
      quotesRes = results[3];
    } catch (e) {
      setStatus("Network error on post " + (p + 1));
      continue;
    }

    if (threadRes.ok) {
      var threadData = await threadRes.json();
      if (threadData.thread && threadData.thread.replies) {
        var stack = [];
        for (var r = 0; r < threadData.thread.replies.length; r++) {
          stack.push(threadData.thread.replies[r]);
        }
        while (stack.length > 0) {
          var node = stack.pop();
          if (!node || !node.post) {
            continue;
          }
          var nodeHandle = node.post.author ? node.post.author.handle : "";
          var nodeName = (node.post.author && node.post.author.displayName) ? node.post.author.displayName : nodeHandle;
          var nodeAvatar = (node.post.author && node.post.author.avatar) ? node.post.author.avatar : "";
          var nodeText = (node.post.record && node.post.record.text) ? node.post.record.text : "";
          var nodeUri = node.post.uri;
          var nodeType = (nodeHandle === rootHandle) ? "thread" : "reply";
          window.particles.push({
            type: nodeType,
            name: nodeName,
            handle: nodeHandle,
            content: nodeText,
            avatar: nodeAvatar,
            uri: nodeUri,
            root: rootUri
          });
          if (node.replies) {
            for (var c = 0; c < node.replies.length; c++) {
              stack.push(node.replies[c]);
            }
          }
        }
      }
    }

    if (likesRes.ok) {
      var likesData = await likesRes.json();
      if (likesData.likes) {
        for (var l = 0; l < likesData.likes.length; l++) {
          var like = likesData.likes[l];
          var actor = like.actor || {};
          var likeHandle = actor.handle || "";
          var likeName = actor.displayName || likeHandle;
          var likeAvatar = actor.avatar || "";
          window.particles.push({
            type: "like",
            name: likeName,
            handle: likeHandle,
            content: "",
            avatar: likeAvatar,
            uri: "",
            root: rootUri
          });
        }
      }
    }

    if (repostsRes.ok) {
      var repostsData = await repostsRes.json();
      if (repostsData.repostedBy) {
        for (var rp = 0; rp < repostsData.repostedBy.length; rp++) {
          var reposter = repostsData.repostedBy[rp];
          var rHandle = reposter.handle || "";
          var rName = reposter.displayName || rHandle;
          var rAvatar = reposter.avatar || "";
          window.particles.push({
            type: "repost",
            name: rName,
            handle: rHandle,
            content: "",
            avatar: rAvatar,
            uri: "",
            root: rootUri
          });
        }
      }
    }

    if (quotesRes.ok) {
      var quotesData = await quotesRes.json();
      if (quotesData.posts) {
        for (var q = 0; q < quotesData.posts.length; q++) {
          var qpost = quotesData.posts[q];
          var qHandle = qpost.author ? qpost.author.handle : "";
          var qName = (qpost.author && qpost.author.displayName) ? qpost.author.displayName : qHandle;
          var qAvatar = (qpost.author && qpost.author.avatar) ? qpost.author.avatar : "";
          var qText = (qpost.record && qpost.record.text) ? qpost.record.text : "";
          var qUri = qpost.uri || "";
          window.particles.push({
            type: "quote",
            name: qName,
            handle: qHandle,
            content: qText,
            avatar: qAvatar,
            uri: qUri,
            root: rootUri
          });
        }
      }
    }

    setStatus("[" + (p + 1) + "/" + collectedPosts.length + "] Processed. Total particles: " + window.particles.length);
  }

  setStatus("Done. Loaded " + window.particles.length + " particles.");
  window.dispatchEvent(new CustomEvent("data:loaded", { detail: window.particles }));
};

window.cam = { x: 0, y: 0, zoom: 1 };

window.resetSimulation = function() {
  window.particles = [];
};

var canvas = document.getElementById("sim-canvas");
var ctx = canvas ? canvas.getContext("2d") : null;
var parent = canvas ? canvas.parentElement : null;

var draw = function() {
  if (canvas && parent) {
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight;
  }
  if (!ctx) {
    requestAnimationFrame(draw);
    return;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  var zoom = window.cam.zoom;
  var cx = canvas.width / 2;
  var cy = canvas.height / 2;
  ctx.setTransform(zoom, 0, 0, zoom, cx - window.cam.x * zoom, cy - window.cam.y * zoom);

  var particles = window.particles || [];
  var i, p, size, drawn, color, radius;
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (typeof p.x !== "number" || typeof p.y !== "number") {
      continue;
    }
    if (p.type === "post") {
      size = 18;
      drawn = false;
      if (p.avatar) {
        if (!p._img) {
          p._img = new Image();
          p._img.src = p.avatar;
        }
        if (p._img.complete && p._img.naturalWidth > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(p._img, p.x - size, p.y - size, size * 2, size * 2);
          ctx.restore();
          drawn = true;
        }
      }
      if (!drawn) {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = "red";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      radius = 5;
      if (p.type === "thread") {
        color = "#ffe600";
      } else if (p.type === "reply") {
        color = "#39ff14";
      } else if (p.type === "like") {
        color = "#4dc3ff";
      } else if (p.type === "repost") {
        color = "#e26bff";
      } else if (p.type === "quote") {
        color = "#ffffff";
      } else {
        color = "#888888";
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(draw);
};

requestAnimationFrame(draw);

window.addEventListener("data:loaded", function(e) {
  var particles = e.detail;
  window.particles = particles;
  var worldSize = 500;
  var halfWorld = worldSize / 2;
  var centers = {};
  var rootPositions = [];
  var i, p, cx, cy, center, jitter;

  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    p.vx = 0;
    p.vy = 0;
    if (p.type === "post") {
      cx = Math.random() * worldSize - halfWorld;
      cy = Math.random() * worldSize - halfWorld;
      centers[p.uri] = { x: cx, y: cy };
      p.x = cx;
      p.y = cy;
      rootPositions.push({ x: cx, y: cy });
    }
  }

  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (p.type !== "post") {
      center = centers[p.root];
      if (center) {
        jitter = 600;
        p.x = center.x + (Math.random() * jitter * 2 - jitter);
        p.y = center.y + (Math.random() * jitter * 2 - jitter);
      } else {
        p.x = Math.random() * worldSize - halfWorld;
        p.y = Math.random() * worldSize - halfWorld;
      }
    }
  }

  var sumX = 0;

    window.simConfig.likeBoostPerLike = v;
  });

  makeSlider(simGroup, "Like Boost Max", 0, 10, 0.5, window.simConfig.likeBoostMax, function(v){
    window.simConfig.likeBoostMax = v;
  });

  var typeOrder = ["post", "thread", "reply", "like", "repost", "quote"];
  var typeColors = {
    post: "#ef4444",
    thread: "#eab308",
    reply: "#22c55e",
    like: "#3b82f6",
    repost: "#a855f7",
    quote: "#ffffff"
  };

  for (var idx = 0; idx < typeOrder.length; idx++) {
    var t = typeOrder[idx];
    (function(type){
      var label = type.charAt(0).toUpperCase() + type.slice(1) + " Influence";
      makeSlider(influenceGroup, label, 0, 2, 0.05, window.simConfig.influenceBase[type], function(v){
        window.simConfig.influenceBase[type] = v;
      }, typeColors[type]);
    })(t);
  }
})();
</script><script>
(function(){
  var style = document.createElement("style");
  style.textContent = [
    "#settings-panel{flex:1;min-height:0;overflow-y:auto;}",
    "#settings-panel::-webkit-scrollbar{width:5px;}",
    "#settings-panel::-webkit-scrollbar-track{background:transparent;}",
    "#settings-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px;}",
    ".matrix-section{margin-top:12px;}",
    ".matrix-legend{font-size:11px;color:var(--text-muted);margin-bottom:10px;line-height:1.4;}",
    ".matrix-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:center;}",
    ".matrix-header{display:flex;align-items:center;justify-content:center;padding:2px;}",
    ".matrix-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);}",
    ".matrix-cell{border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);min-width:0;}",
    ".matrix-cell input{width:100%;background:transparent;border:none;color:#e6e7eb;text-align:center;font-size:11px;font-family:inherit;padding:5px 0;outline:none;-moz-appearance:textfield;}",
    ".matrix-cell input::-webkit-outer-spin-button,.matrix-cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}"
  ].join("");
  document.head.appendChild(style);

  var types = ["post","thread","reply","like","repost","quote"];
  var typeColors = {post:"#ef4444",thread:"#eab308",reply:"#22c55e",like:"#3b82f6",repost:"#a855f7",quote:"#ffffff"};

  var saved = localStorage.getItem("bskylife_matrix");
  if (saved) {
    try {
      var parsed = JSON.parse(saved);
      for (var i = 0; i < types.length; i++) {
        var r = types[i];
        if (!window.forceMatrix[r]) continue;
        for (var j = 0; j < types.length; j++) {
          var c = types[j];
          if (parsed[r] && typeof parsed[r][c] === "number") {
            window.forceMatrix[r][c] = parsed[r][c];
          }
        }
      }
    } catch (e) {}
  }

  function colorForValue(v) {
    var nr = 26, ng = 29, nb = 41;
    if (v < 0) {
      var t = -v;
      var rr = 127, rg = 29, rb = 29;
      var r = Math.round(nr + (rr - nr) * t);
      var g = Math.round(ng + (rg - ng) * t);
      var b = Math.round(nb + (rb - nb) * t);
      return "rgb(" + r + "," + g + "," + b + ")";
    } else {
      var t = v;
      var gr = 20, gg = 83, gb = 45;
      var r = Math.round(nr + (gr - nr) * t);
      var g = Math.round(ng + (gg - ng) * t);
      var b = Math.round(nb + (gb - nb) * t);
      return "rgb(" + r + "," + g + "," + b + ")";
    }
  }

  var panel = document.getElementById("settings-panel");
  if (!panel) return;

  var section = document.createElement("div");
  section.className = "matrix-section";

  var header = document.createElement("div");
  header.className = "settings-header";
  header.textContent = "Force Matrix";
  header.setAttribute("aria-expanded", "false");

  var body = document.createElement("div");
  body.className = "settings-body";
  body.style.display = "none";

  var legend = document.createElement("div");
  legend.className = "matrix-legend";
  legend.textContent = "row particle is pulled or pushed by column particle (negative pushes away, positive pulls together)";

  var grid = document.createElement("div");
  grid.className = "matrix-grid";

  grid.appendChild(document.createElement("div"));

  for (var i = 0; i < types.length; i++) {
    var th = document.createElement("div");
    th.className = "matrix-header";
    var dot = document.createElement("div");
    dot.className = "matrix-dot";
    dot.style.background = typeColors[types[i]];
    dot.title = types[i];
    th.appendChild(dot);
    grid.appendChild(th);
  }

  var cellRefs = [];

  for (var i = 0; i < types.length; i++) {
    var rowType = types[i];
    var rh = document.createElement("div");
    rh.className = "matrix-header";
    var rdot = document.createElement("div");
    rdot.className = "matrix-dot";
    rdot.style.background = typeColors[rowType];
    rdot.title = rowType;
    rh.appendChild(rdot);
    grid.appendChild(rh);

    for (var j = 0; j < types.length; j++) {
      var colType = types[j];
      var val = window.forceMatrix[rowType][colType];
      if (typeof val !== "number") val = 0;

      var cell = document.createElement("div");
      cell.className = "matrix-cell";
      cell.style.background = colorForValue(val);
      cell.style.color = "#e6e7eb";

      var inp = document.createElement("input");
      inp.type = "number";
      inp.min = "-1";
      inp.max = "1";
      inp.step = "0.05";
      inp.value = val.toFixed(2);

      (function(r, c, cellEl, inpEl){
        inpEl.addEventListener("input", function(){
          var v = parseFloat(inpEl.value);
          if (isNaN(v)) v = 0;
          if (v < -1) v = -1;
          if (v > 1) v = 1;
          window.forceMatrix[r][c] = v;
          cellEl.style.background = colorForValue(v);
          try {
            localStorage.setItem("bskylife_matrix", JSON.stringify(window.forceMatrix));
          } catch (e) {}
        });
      })(rowType, colType, cell, inp);

      cell.appendChild(inp);
      grid.appendChild(cell);
      cellRefs.push({ row: rowType, col: colType, input: inp, cell: cell });
    }
  }

  body.appendChild(legend);
  body.appendChild(grid);
  section.appendChild(header);
  section.appendChild(body);
  panel.appendChild(section);

  header.addEventListener("click", function(){
    var expanding = body.style.display === "none";
    body.style.display = expanding ? "block" : "none";
    header.setAttribute("aria-expanded", expanding ? "true" : "false");
    if (expanding) {
      for (var k = 0; k < cellRefs.length; k++) {
        var ref = cellRefs[k];
        var v = window.forceMatrix[ref.row][ref.col];
        if (typeof v !== "number") v = 0;
        ref.input.value = v.toFixed(2);
        ref.cell.style.background = colorForValue(v);
      }
    }
  });
})();
</script>
